server {
    listen 80;

    location / {
        # O Nginx resolve o nome do container "radar-backend" através da rede frontend-net
        proxy_pass http://radar-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Proxy-Layer "frontend-net-dmz";
    }
}
